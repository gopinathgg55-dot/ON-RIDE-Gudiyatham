name: Build Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release AAB
        run: gradle bundleRelease

      - name: Sign Release AAB
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore onride.jks -storepass onride123 -keypass onride123 app/build/outputs/bundle/release/app-release.aab onride

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ON-RIDE-RELEASE-AAB
          path: app/build/outputs/bundle/release/app-release.aab

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle
      run: sudo apt-get update && sudo apt-get install -y gradle

    - name: Build Debug APK with Gradle
      run: gradle :onride-iks:assembleDebug

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: onride-iks/build/outputs/apk/debug/onride-iks-debug.apk
